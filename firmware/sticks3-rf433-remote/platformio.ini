[env:m5stack-sticks3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/add_cmake_path.py
platform_packages =
  platformio/tool-cmake@^3.30.2
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
board_build.cmake_extra_args = -DZ_FEATURE_MULTI_THREAD=0
lib_deps =
  m5stack/M5Unified@^0.2.12
  m5stack/M5GFX@^0.2.18
  bblanchon/ArduinoJson@^7.4.2
  https://github.com/eclipse-zenoh/zenoh-pico.git#1.9.0
build_flags =
  -include time.h
  -include unistd.h
  -DCORE_DEBUG_LEVEL=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DESP32S3
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
